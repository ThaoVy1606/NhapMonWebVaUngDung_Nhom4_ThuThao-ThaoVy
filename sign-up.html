<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - The Moon Cat Furniture</title>
    <link href="https://fonts.googleapis.com/css?family=Inter|Roboto&display=swap" rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/desktop.css" media="screen and (min-width: 601px)">
    <link rel="stylesheet" href="css/mobile.css" media="screen and (max-width: 600px)">
</head>

<body>

    <!-- Auth Wrapper with Living Room Background -->
    <div class="auth-page" style="background-image: url('images/image-34.png');">
        <div class="auth-container">

            <!-- Left Box: Form đăng ký -->
            <section class="auth-glass-box">
                <h2>CHÀO MỪNG GIA NHẬP!</h2>

                <form class="auth-form" id="register-form">
                    <!-- Input Username -->
                    <div class="auth-input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#555555"
                            stroke-width="2" class="input-icon">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input type="text" id="register-user" placeholder="Tên đăng nhập" required
                            autocomplete="username">
                    </div>

                    <!-- Input Email or Phone -->
                    <div class="auth-input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#555555"
                            stroke-width="2" class="input-icon">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input type="text" id="register-contact" placeholder="Địa chỉ Email hoặc Số điện thoại"
                            required>
                    </div>

                    <!-- Input Password -->
                    <div class="auth-input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#555555"
                            stroke-width="2" class="input-icon">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" id="register-pass" placeholder="Mật khẩu" required
                            autocomplete="new-password">
                    </div>

                    <!-- Input Confirm Password -->
                    <div class="auth-input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#555555"
                            stroke-width="2" class="input-icon">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                        <input type="password" id="register-confirm" placeholder="Xác nhận mật khẩu" required
                            autocomplete="new-password">
                    </div>

                    <!-- Thông báo lỗi -->
                    <div id="register-error"
                        style="color: #ff4d4d; font-size: 13px; font-weight: 600; display: none; text-align: center;">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="auth-btn">ĐĂNG KÝ NGAY</button>
                </form>

                <div class="auth-footer-text">
                    Đã có tài khoản? <a href="sign-in.html">ĐĂNG NHẬP NGAY.</a>
                </div>
            </section>

            <!-- Right Column: Tên thương hiệu -->
            <section class="auth-brand-section">
                <div class="auth-logo-circle">
                    <img src="images/logo-84.png" alt="Logo">
                </div>
                <h1>THE MOON CAT</h1>
                <p>FURNITURE</p>
            </section>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const registerForm = document.getElementById("register-form");
            const errorDiv = document.getElementById("register-error");

            registerForm.addEventListener("submit", (e) => {
                e.preventDefault();
                errorDiv.style.display = "none";

                const userInput = document.getElementById("register-user").value.trim();
                const contactInput = document.getElementById("register-contact").value.trim();
                const passInput = document.getElementById("register-pass").value;
                const confirmInput = document.getElementById("register-confirm").value;

                // Kiểm tra lại mật khẩu
                if (passInput !== confirmInput) {
                    errorDiv.innerText = "Mật khẩu xác nhận không trùng khớp!";
                    errorDiv.style.display = "block";
                    return;
                }

                if (userInput.length < 3) {
                    errorDiv.innerText = "Tên đăng nhập phải chứa ít nhất 3 ký tự!";
                    errorDiv.style.display = "block";
                    return;
                }

                // Lấy dữ liệu cơ sở người dùng
                const users = JSON.parse(localStorage.getItem("tmc_users")) || DEFAULT_USERS;

                // Check if user already exists
                const exists = users.some(u => u.username === userInput || u.email === contactInput || u.phone === contactInput);
                if (exists) {
                    errorDiv.innerText = "Tên đăng nhập hoặc Email/Số điện thoại đã tồn tại!";
                    errorDiv.style.display = "block";
                    return;
                }

                // Tạo đối tượng user mới
                const isEmail = contactInput.includes("@");
                const newUser = {
                    username: userInput,
                    email: isEmail ? contactInput : `${userInput}@themooncat.com`,
                    phone: isEmail ? "Chưa cập nhật" : contactInput,
                    address: "Chưa cập nhật",
                    password: passInput,
                    rank: "ĐỒNG",
                    spending: 0
                };

                // Lưu
                users.push(newUser);
                localStorage.setItem("tmc_users", JSON.stringify(users));

                // Auto login
                setSessionUser(newUser);

                // Thông báo
                showNotification("Đăng ký tài khoản thành công! Đang đăng nhập...");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);
            });
        });
    </script>

    <!-- Liên kết javascript -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
